name: Release

# Builds CerlockCS for Windows, Linux and macOS and publishes a GitHub
# release with the files. Runs when a tag like v0.1.0 is pushed, or by hand
# from the Actions tab with the version to release. The release notes are
# the matching section of CHANGELOG.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Release notes
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "bad version: $VERSION" >&2
            exit 1
          fi
          awk -v v="$VERSION" '/^## / { p = ($2 == v); next } p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          cat notes.md

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: go test ./...

      - name: Windows resources
        # The icon, version info and manifest of the Windows exe. go-winres
        # names the files *_windows_<arch>.syso, so other builds skip them.
        working-directory: cmd/cerlock
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          "$(go env GOPATH)/bin/go-winres" make --arch amd64,arm64 \
            --product-version "${VERSION#v}" --file-version "${VERSION#v}"
          ls -la *.syso

      - name: Build
        run: |
          tag="$VERSION"
          mkdir -p build dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="cerlock-$tag-$os-$arch"
            exe="cerlock"
            ldflags="-s -w -X main.version=$tag"
            if [ "$os" = windows ]; then
              # A GUI program, so it opens its own window and no console.
              exe="Cerlock.exe"
              ldflags="$ldflags -H=windowsgui"
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "$ldflags" -o "build/$name/$exe" ./cmd/cerlock
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -czf "dist/$name.tar.gz" -C build "$name"
            fi
          done
          # The plain exe too, so Windows users can download it and run it.
          cp "build/cerlock-$tag-windows-amd64/Cerlock.exe" "dist/cerlock-$tag-windows-amd64.exe"
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "CerlockCS $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
