name: Release

# Pushing a tag like v0.1.0 builds CerlockCS for Windows, Linux and macOS and
# publishes a GitHub release with the files. The release notes come from the
# tag message.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          tag="$GITHUB_REF_NAME"
          mkdir -p build dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="cerlock-$tag-$os-$arch"
            ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$tag" -o "build/$name/cerlock$ext" ./cmd/cerlock
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -czf "dist/$name.tar.gz" -C build "$name"
            fi
          done
          # The plain exe too, so Windows users can download it and run it.
          cp "build/cerlock-$tag-windows-amd64/cerlock.exe" "dist/cerlock-$tag-windows-amd64.exe"
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "CerlockCS $GITHUB_REF_NAME" \
            --notes-from-tag \
            --verify-tag
